---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install bind9
  ansible.builtin.apt:
    name:
      - bind9
      - bind9utils
      - dnsutils
    state: present

- name: Create zones directory
  ansible.builtin.file:
    path: "{{ zones_dir }}"
    state: directory
    owner: root
    group: bind
    mode: "0755"

- name: Create log directory
  ansible.builtin.file:
    path: "{{ log_dir }}"
    state: directory
    owner: bind
    group: bind
    mode: "0755"

- name: Disable IPv6 for bind9
  ansible.builtin.copy:
    content: 'OPTIONS="-u bind -4"'
    dest: /etc/default/named
    mode: "0644"
  notify: restart bind9

- name: Enable bind9 on boot
  ansible.builtin.systemd:
    name: bind9
    enabled: true